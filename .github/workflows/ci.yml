name: CPU smoke tests

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/constraints-verified.txt
            .github/workflows/ci.yml
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Install CPU dependencies
        run: |
          python -m pip install torch -c backend/constraints-verified.txt --index-url https://download.pytorch.org/whl/cpu
          # XGBoost's manylinux2014 wheel uses the same pinned version without GPU/NCCL libraries.
          python -m pip download xgboost -c backend/constraints-verified.txt --platform manylinux2014_x86_64 --only-binary=:all: --no-deps --dest "$RUNNER_TEMP/xgboost-cpu"
          python -m pip install "$RUNNER_TEMP"/xgboost-cpu/*.whl
          python -m pip install -r backend/requirements-dev.txt -c backend/constraints-verified.txt
          python -m pip check
          python -c "import torch; assert torch.version.cuda is None, 'CI requires a CPU-only PyTorch wheel'"
      - name: Check Python syntax
        run: python -m compileall backend/app -q
      - name: Run backend smoke tests
        run: python -m pytest backend/tests/test_smoke.py backend/tests/test_quick_training.py backend/tests/test_frontend_entry.py backend/tests/test_run_launcher.py -q
      - name: Run frontend pure-function tests
        run: node --test backend/tests/frontend_word0904.mjs backend/tests/frontend_batch_progress.mjs backend/tests/frontend_comparison_page.mjs
